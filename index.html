<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempokiri — 节奏感知的剪辑工具</title>
<style>
  :root {
    /* 结构令牌 */
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-pill: 9999px;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --transition-fast: 0.15s var(--ease-out);
    --transition-normal: 0.25s var(--ease-out);
    /* aurora 色彩令牌 */
    --bg-app: #090a0f;
    --surface-base: #0f1219;
    --surface-raised: #161b26;
    --surface-overlay: #1e2433;
    --surface-active: #262e40;
    --border-subtle: rgba(255,255,255,0.06);
    --border-muted: rgba(255,255,255,0.12);
    --border-focus: rgba(34,211,238,0.55);
    --accent: #22d3ee;
    --accent-muted: rgba(34,211,238,0.15);
    --accent-glow: rgba(34,211,238,0.25);
    --accent-hover: #38bdf8;
    --danger: #f43f5e;
    --danger-muted: rgba(244,63,94,0.15);
    --warning: #f59e0b;
    --warning-muted: rgba(245,158,11,0.18);
    --success: #10b981;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-tertiary: #64748b;
    /* 阴影令牌 */
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.35);
    --shadow-md: 0 4px 12px -1px rgba(0,0,0,0.45), 0 2px 4px -1px rgba(0,0,0,0.3);
    --shadow-lg: 0 12px 28px -4px rgba(0,0,0,0.6), 0 4px 8px -2px rgba(0,0,0,0.4);
    --shadow-glow: 0 0 16px -2px var(--accent-glow);
    /* 扩展令牌（三主题支撑） */
    --accent-2: #a78bfa;
    --accent-fg: #04222b;
    --wave-bg: #0b0d13;
    --grid-line: rgba(255,255,255,0.02);
    --shadow-inset-wave: inset 0 2px 8px rgba(0,0,0,0.5);
    --scroll-thumb: #2a3345;
    --scroll-thumb-hover: #3a4560;
  }
  [data-theme="nebula"] {
    --bg-app: #0b0712;
    --surface-base: #120d1c;
    --surface-raised: #191226;
    --surface-overlay: #221a33;
    --surface-active: #2c2340;
    --border-subtle: rgba(255,255,255,0.06);
    --border-muted: rgba(255,255,255,0.12);
    --border-focus: rgba(167,139,250,0.55);
    --accent: #a78bfa;
    --accent-muted: rgba(167,139,250,0.15);
    --accent-glow: rgba(167,139,250,0.25);
    --accent-hover: #b7a0fb;
    --text-primary: #ece7f7;
    --text-secondary: #a89fc0;
    --text-tertiary: #7d7596;
    /* 扩展令牌覆盖（danger/warning/success/shadow 共享 :root 暗色值） */
    --accent-2: #22d3ee;
    --accent-fg: #221238;
    --wave-bg: #0d0a14;
    --grid-line: rgba(255,255,255,0.02);
    --shadow-inset-wave: inset 0 2px 8px rgba(0,0,0,0.5);
    --scroll-thumb: #3a2f4d;
    --scroll-thumb-hover: #4a3d5e;
  }
  [data-theme="paper"] {
    --bg-app: #f5f2ed;
    --surface-base: #fbfaf7;
    --surface-raised: #ffffff;
    --surface-overlay: #efeae3;
    --surface-active: #e6dfd4;
    --border-subtle: rgba(0,0,0,0.07);
    --border-muted: rgba(0,0,0,0.16);
    --border-focus: rgba(15,118,110,0.55);
    --accent: #0f766e;
    --accent-muted: rgba(15,118,110,0.14);
    --accent-glow: rgba(15,118,110,0.25);
    --accent-hover: #148f86;
    --text-primary: #2a2522;
    --text-secondary: #5f5a54;
    --text-tertiary: #8a8378;
    /* 浅色阴影 */
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.12);
    --shadow-md: 0 4px 12px -1px rgba(0,0,0,0.16), 0 2px 4px -1px rgba(0,0,0,0.1);
    --shadow-lg: 0 12px 28px -4px rgba(0,0,0,0.25), 0 4px 8px -2px rgba(0,0,0,0.15);
    /* 扩展令牌覆盖（warning/success 共享 :root 值） */
    --accent-2: #6d4fae;
    --accent-fg: #ffffff;
    --wave-bg: #f0ece4;
    --grid-line: rgba(0,0,0,0.03);
    --shadow-inset-wave: inset 0 2px 8px rgba(0,0,0,0.08);
    --scroll-thumb: #cfc8bb;
    --scroll-thumb-hover: #b8b0a0;
    --danger: #d63a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg-app);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    background: var(--surface-raised);
    border-bottom: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-sm);
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 16px; letter-spacing: 1px; margin-right: 8px; }
  .brand-name {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-tag {
    color: var(--text-secondary);
    font-size: 12px;
    white-space: nowrap;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #brandPulse { height: 20px; width: 64px; opacity: 0.85; }
  .spacer { flex: 1; }
  .btn {
    background: var(--surface-overlay);
    color: var(--text-primary);
    border: 1px solid var(--border-muted);
    border-radius: var(--radius-sm);
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all var(--transition-fast);
    user-select: none;
  }
  .btn:hover:not(:disabled) {
    background: var(--surface-active);
    border-color: rgba(255, 255, 255, 0.2);
    color: var(--text-primary);
  }
  .btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--bg-app), 0 0 0 4px var(--accent);
  }
  .btn:active:not(:disabled) {
    transform: scale(0.98);
  }
  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    background: var(--surface-base);
    border-color: var(--border-subtle);
  }
  .btn-primary { background: var(--accent); color: var(--accent-fg); font-weight: 600; border-color: transparent; box-shadow: 0 2px 10px var(--accent-glow); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 4px 16px var(--accent-glow); }

  #stage { position: relative; margin: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  #waveWrap {
    position: relative;
    height: 280px;
    background-color: var(--wave-bg);
    background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-inset-wave);
  }
  #waveWrap.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow), inset 0 0 12px var(--accent-muted); }
  #wave { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #playHead { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #waveHint[hidden] { display: none; }
  #waveHint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    pointer-events: none;
    padding: 20px;
    line-height: 1.8;
  }
  #captureBar {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 10px;
    height: 6px;
    background: var(--surface-raised);
    border-radius: 3px;
    overflow: hidden;
  }
  #captureFill { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }
  #selToEnd {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 2;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    background: var(--surface-base);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    cursor: pointer;
  }
  #selToEnd:hover { border-color: var(--accent); color: var(--accent); }
  #selToEnd[hidden] { display: none; }

  #waveRow { display: flex; gap: 14px; align-items: stretch; }
  #videoWrap {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000000;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  #videoWrap[hidden] { display: none; }
  #waveWrap { flex: 1; min-width: 0; }
  #video { width: 100%; height: 100%; max-height: 260px; display: block; object-fit: contain; }

  #statusBar {
    margin: 0 20px;
    min-height: 24px;
    display: flex;
    align-items: center;
    color: var(--text-tertiary);
    font-size: 12px;
    letter-spacing: 0.2px;
  }

  .hint-inline { color: var(--text-secondary); font-size: 12px; }
  #seqInfo { color: var(--text-secondary); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .empty { color: var(--text-secondary); font-size: 13px; padding: 8px 0; }
  .seq-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-raised);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: 13px;
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
    transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
  }
  .seq-card:hover {
    background: var(--surface-overlay);
    border-color: var(--border-muted);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .seq-card.playing {
    background: var(--surface-overlay);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset, var(--shadow-glow);
  }
  .seq-card.playing::before {
    content: '';
    position: absolute;
    left: -1px; top: 8px; bottom: 8px;
    width: 3px;
    border-radius: 2px;
    background: var(--danger);
  }
  .seq-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent); color: var(--accent-fg);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
  }
  .seq-range { font-weight: 600; }
  .seq-time { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
  .fade { display: flex; align-items: center; gap: 4px; color: var(--text-secondary); font-size: 12px; }
  .fade input { width: 64px; }
  .btn-mini {
    background: var(--surface-raised);
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    width: 26px; height: 26px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .btn-mini:hover { background: var(--surface-overlay); color: var(--text-primary); border-color: var(--border-muted); }
  .btn-mini.del:hover { border-color: var(--danger); color: var(--danger); }

  /* 模态框 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--surface-base);
    border: 1px solid var(--border-muted);
    border-radius: var(--radius-lg);
    padding: 18px 22px;
    width: 380px;
    max-width: calc(100vw - 40px);
    box-shadow: var(--shadow-lg);
  }
  .modal h3 { margin: 0 0 6px; font-size: 16px; }
  .modal-sub { margin: 0 0 14px; color: var(--text-secondary); font-size: 12px; }
  .modal-form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .modal-form label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-primary); }
  .modal-form input[type="number"], .modal-form select { min-width: 0; }
  .modal-form input[type="number"] { flex: 1; }
  .modal-wide { width: 720px; max-width: calc(100vw - 40px); }
  .th-sub { font-weight: 400; color: var(--text-secondary); font-size: 10px; }
  .seg-rest { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
  .seg-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .seg-table th { font-size: 11px; color: var(--text-secondary); font-weight: 500; padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--border-muted); }
  .seg-table td { padding: 4px 6px; vertical-align: middle; }
  .seg-table .seg-bpm { width: 70px; }
  .seg-table .seg-qty { width: 64px; }
  .seg-table .seg-res { width: 60px; }
  .modal-status { color: var(--accent); font-size: 12px; margin-bottom: 10px; }
  .q-group { display: flex; align-items: center; gap: 6px; background: var(--surface-base); padding: 3px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
  .q-label { font-size: 11px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  .q-val { font-size: 13px; font-weight: 600; color: var(--accent); min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .q-btns { display: flex; gap: 3px; }
  .q-btns .btn-mini { background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: 4px; height: 22px; padding: 0 6px; font-size: 11px; color: var(--text-secondary); width: auto; min-width: 36px; }
  .q-btns .btn-mini:hover { background: var(--surface-overlay); color: var(--text-primary); border-color: var(--border-muted); }
  .q-neg .btn-mini { border-color: rgba(244,63,94,0.35); }
  .q-neg .btn-mini:hover { border-color: var(--danger); color: var(--danger); }
  .q-pos .btn-mini { border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .q-pos .btn-mini:hover { border-color: var(--accent); color: var(--accent); }
  .controlbar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 0;
    padding: 10px 16px;
    background: var(--surface-raised);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    flex-wrap: wrap;
  }
  .cb-group { display: flex; align-items: center; gap: 8px; }
  .cb-group .btn { padding: 6px 12px; }
  .controlbar .hint-inline { margin-left: 2px; }
  .quickbar { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  .seq-toolbar { margin-bottom: 8px; }
  .seq-panel {
    margin: 12px 20px;
    background: var(--surface-base);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
  }
  .seq-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .seq-header h2 { margin: 0; font-size: 14px; }
  .seq-list { display: flex; flex-direction: column; gap: 8px; }
  .seq-card.dragging { opacity: 0.55; border-color: var(--accent); box-shadow: 0 6px 18px rgba(0,0,0,0.4); cursor: grabbing; }
  .seq-card { cursor: grab; user-select: none; }
  .seq-card:active { cursor: grabbing; }
  .unit-input { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
  .unit-mode-btn { font-size: 11px; padding: 1px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border-muted); background: var(--surface-overlay); color: var(--text-tertiary); cursor: pointer; white-space: nowrap; }
  .unit-mode-btn:hover { color: var(--text-primary); border-color: var(--accent); }
  .unit-fields { display: inline-flex; gap: 3px; }
  .unit-fields.unit-invalid input { border-color: #e5484d; background: rgba(229,72,77,0.14); }
  .unit-fields input { width: 58px; padding: 2px 4px; }
  .unit-ref:has(+ .unit-invalid), .unit-invalid + .unit-ref { color: #e5484d; }
  .seq-edges { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .edge-label { font-size: 11px; color: var(--text-tertiary); }
  .seq-card.invalid { border-color: #e5484d; box-shadow: 0 0 0 1px #e5484d inset; }
  .manual-form { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 10px; border: 1px dashed var(--border-muted); border-radius: 10px; background: var(--surface-overlay); flex-wrap: wrap; }
  .manual-form[hidden] { display: none; }
  .modal-actions { display: flex; align-items: center; gap: 8px; }
  /* 输入框统一样式（方案 3.3） */
  .unit-fields input, .fade input, .modal-form input[type="number"], .modal-form select, .seg-table input[type="number"], .seg-table select {
    background: var(--bg-app);
    border: 1px solid var(--border-muted);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 5px 8px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .unit-fields input { width: 58px; padding: 2px 4px; }
  /* 输入聚焦发光 */
  .unit-fields input:focus, .fade input:focus, .modal-form input:focus, .modal-form select:focus, .seg-table input:focus, .seg-table select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-muted);
  }
  /* 按钮按压反馈 */
  .btn-mini:active, .unit-mode-btn:active { transform: translateY(1px); }
  /* 细滚动条 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-app); }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 5px; border: 2px solid var(--bg-app); }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
  body { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) var(--bg-app); }
  /* 空状态引导（波形区 hint 已有；序列空态增强） */
  .empty { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 13px; padding: 10px 14px; background: var(--surface-overlay); border: 1px dashed var(--border-muted); border-radius: 8px; }
  .empty::before { content: 'ℹ'; color: var(--accent); font-size: 14px; }
  /* 拼接序列进度条 */
  .seq-progress {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    margin-bottom: 12px;
    background: var(--surface-base);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
  }
  .seq-progress[hidden] { display: none; }
  .seq-progress-track {
    position: relative;
    flex: 1;
    height: 10px;
    background: var(--bg-app);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-pill);
    cursor: pointer;
    overflow: visible;
    touch-action: none;
  }
  .seq-progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-muted), var(--accent));
    border-radius: var(--radius-pill);
    pointer-events: none;
  }
  /* 拼接点标记：段边界竖线（金黄，与播放头玫红、填充青色区分） */
  .seq-progress-seams {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .seq-progress-seams .seam {
    position: absolute;
    top: -2px; bottom: -2px;
    width: 2px;
    margin-left: -1px;
    background: var(--warning);
    box-shadow: 0 0 6px var(--warning-muted);
    border-radius: 1px;
  }
  .seq-progress-knob {
    position: absolute;
    top: 50%;
    width: 16px; height: 16px;
    margin-left: -8px;
    margin-top: -8px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid var(--danger);
    box-shadow: 0 0 8px var(--danger-muted);
    transition: transform 0.1s ease;
    pointer-events: none;
  }
  .seq-progress-time {
    font-size: 12px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 120px;
    text-align: right;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  /* 页脚签名 */
  .site-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin: 16px 20px 20px;
    padding: 14px 20px;
    background: var(--surface-base);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    position: relative; /* 保留：footer-toast 的 absolute 定位上下文（方案未涉及 toast） */
  }
  .footer-sign {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .footer-heart {
    color: var(--danger);
    font-size: 14px;
  }
  .footer-name {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    color: var(--text-primary);
    background: none;
    -webkit-text-fill-color: initial;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .footer-version {
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-muted);
    border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
    border-radius: var(--radius-pill);
    padding: 1px 8px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .footer-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .footer-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-raised);
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: all var(--transition-fast);
  }
  .footer-btn:hover {
    color: var(--text-primary);
    border-color: var(--border-muted);
    background: var(--surface-overlay);
  }
  .footer-btn:disabled { opacity: 0.5; cursor: wait; }
  .footer-bili:hover {
    border-color: #fb7299;
    color: #fb7299;
    box-shadow: 0 0 12px rgba(251,114,153,0.35);
  }
  .footer-gh:hover {
    border-color: #e6edf3;
    color: #e6edf3;
    box-shadow: 0 0 12px rgba(230,237,243,0.3);
  }
  #btnReadme:hover, #btnCheckUpdate:hover, #btnAdvanced:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .footer-toast {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 16px;
    background: var(--surface-overlay);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text-primary);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 90;
  }
  .footer-toast[hidden] { display: none; }
  /* 数字排版等宽（方案 5.2） */
  .seq-num, .seq-time, .seq-range, .seq-progress-time, .q-val, .footer-version {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  /* README 弹窗 */
  .readme-modal { width: 720px; max-width: calc(100vw - 40px); display: flex; flex-direction: column; max-height: 80vh; }
  .readme-modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .readme-modal-head h3 { margin: 0; font-size: 16px; }
  .readme-version { font-size: 11px; color: var(--text-secondary); }
  .readme-modal-body {
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.7;
    padding-right: 6px;
  }
  .readme-modal-body h2 { font-size: 17px; margin: 14px 0 6px; color: var(--accent); }
  .readme-modal-body h3 { font-size: 15px; margin: 12px 0 6px; }
  .readme-modal-body p { margin: 6px 0; }
  .readme-modal-body ul, .readme-modal-body ol { margin: 6px 0; padding-left: 22px; }
  .readme-modal-body li { margin: 3px 0; }
  .readme-modal-body code {
    background: var(--surface-overlay);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12px;
    font-family: ui-monospace, Consolas, monospace;
  }
  .readme-modal-body pre {
    background: var(--bg-app);
    border: 1px solid var(--border-muted);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
  }
  .readme-modal-body pre code { background: none; padding: 0; }
  /* 键盘焦点轮廓（可访问性，鼠标点击不显示） */
  .btn-mini:focus-visible, .unit-mode-btn:focus-visible, .footer-btn:focus-visible, .exp-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 窄屏（≤480px）：按钮文字不换行压缩，整组换行；保持无水平滚动 */
  @media (max-width: 480px) {
    .toolbar { padding: 10px 12px; }
    .brand-tag { display: none; }
    .controlbar { gap: 8px; padding: 6px 8px; }
    .cb-group { gap: 4px; flex-wrap: wrap; }
    .cb-group .btn { padding: 5px 9px; font-size: 12px; white-space: nowrap; }
    .quickbar { gap: 8px; flex-wrap: wrap; width: 100%; }
    .q-group { gap: 4px; flex-wrap: wrap; }
    .q-btns .btn-mini { min-width: 30px; padding: 0 4px; font-size: 10px; }
    #waveWrap { height: 220px; }
    .seq-panel { padding: 12px 14px; margin: 10px 12px; }
    #stage { margin: 12px 14px; }
    #statusBar { margin: 0 14px; }
    .site-footer { margin: 12px 14px 14px; padding: 10px 14px; }
  }
</style>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><span class="brand-name" data-i18n="app.brandName">Tempokiri</span><span class="brand-tag" data-i18n="app.brandTag">节奏感知的音频/视频剪辑工作站</span><span class="footer-version">v<span data-version>__VERSION__</span></span><canvas id="brandPulse" width="64" height="20" aria-hidden="true"></canvas></div>
    <input id="fileInput" type="file" accept="audio/*,video/*" hidden />
    <button id="btnOpenFile" class="btn" data-i18n="toolbar.openFile">打开文件</button>
    <button id="btnSettings" class="btn" disabled data-i18n="toolbar.setBpm">设置节拍</button>
    <span class="spacer"></span>
    <button id="btnExport" class="btn btn-primary" disabled data-i18n="toolbar.export">导出</button>
  </header>

  <div id="stage">
    <div id="waveRow">
      <div id="videoWrap" hidden><video id="video"></video></div>
      <div id="waveWrap">
        <canvas id="wave"></canvas>
        <canvas id="playHead"></canvas>
        <div id="waveHint" data-i18n="wave.hint">拖入音频或视频文件，或点击此处选择文件开始剪辑</div>
        <div id="captureBar" hidden><div id="captureFill"></div></div>
        <button id="selToEnd" class="sel-chip" hidden data-i18n="wave.toEnd">⤳ 延伸到末尾</button>
      </div>
    </div>
    <div id="controlBar" class="controlbar" hidden>
      <span class="cb-group">
        <button id="btnPlay" class="btn" disabled data-i18n="wave.play">▶ 播放</button>
        <button id="btnStop" class="btn" disabled data-i18n="wave.stop">⏹ 停止</button>
        <button id="btnPlaySeq" class="btn" disabled data-i18n="wave.playSeq">▶ 播放拼接序列</button>
        <button id="btnAddSelection" class="btn" disabled data-i18n="wave.addSelection">＋ 添加选中区间</button>
      </span>
      <span class="spacer"></span>
      <div id="quickBar" class="quickbar" hidden>
        <span class="q-group">
          <span class="q-label" id="qBpmLabel" data-i18n="quick.bpm">BPM</span>
          <span class="q-btns q-neg">
            <button class="btn btn-mini" data-q="bpm" data-d="-1">-1</button>
            <button class="btn btn-mini" data-q="bpm" data-d="-0.1">-0.1</button>
            <button class="btn btn-mini" data-q="bpm" data-d="-0.01">-0.01</button>
          </span>
          <span class="q-val" id="qBpmVal">--</span>
          <span class="q-btns q-pos">
            <button class="btn btn-mini" data-q="bpm" data-d="0.01">+0.01</button>
            <button class="btn btn-mini" data-q="bpm" data-d="0.1">+0.1</button>
            <button class="btn btn-mini" data-q="bpm" data-d="1">+1</button>
          </span>
        </span>
        <span class="q-group">
          <span class="q-label" data-i18n="quick.offset">偏移</span>
          <span class="q-btns q-neg">
            <button class="btn btn-mini" data-q="offset" data-d="-1">-1</button>
            <button class="btn btn-mini" data-q="offset" data-d="-0.1">-0.1</button>
            <button class="btn btn-mini" data-q="offset" data-d="-0.01">-0.01</button>
          </span>
          <span class="q-val" id="qOffsetVal">--</span>
          <span class="q-btns q-pos">
            <button class="btn btn-mini" data-q="offset" data-d="0.01">+0.01</button>
            <button class="btn btn-mini" data-q="offset" data-d="0.1">+0.1</button>
            <button class="btn btn-mini" data-q="offset" data-d="1">+1</button>
          </span>
        </span>
      </div>
      <span class="hint-inline" data-i18n="wave.hintInline">单击定位 · 双击选小节 · 拖拽选区 · 滚轮平移 · Ctrl+滚轮缩放</span>
    </div>
  </div>


  <div id="statusBar"></div>

  <section id="sequencePanel" class="seq-panel">
    <div class="seq-header">
      <h2><span data-i18n="seq.title">拼接序列</span><span id="seqInfo"></span></h2>
      <span class="spacer"></span>
      <button id="btnManualAdd" class="btn" data-i18n="seq.manualAdd">手动添加</button>
    </div>
    <!-- 拼接序列进度条：播放进度控制；每个拼接点（段边界）以特殊标记注明 -->
    <div id="seqProgress" class="seq-progress" hidden>
      <div class="seq-progress-track" id="seqProgressTrack">
        <div class="seq-progress-fill" id="seqProgressFill"></div>
        <div class="seq-progress-seams" id="seqProgressSeams"></div>
        <div class="seq-progress-knob" id="seqProgressKnob"></div>
      </div>
      <span class="seq-progress-time" id="seqProgressTime">0:00.0 / 0:00.0</span>
    </div>
    <div id="manualForm" class="manual-form" hidden>
      <span class="edge-label" data-i18n="seq.edgeStart">起</span><span id="maStart"></span>
      <span class="edge-label" data-i18n="seq.edgeEnd">止</span><span id="maEnd"></span>
      <button id="btnManualOk" class="btn btn-mini-wide" data-i18n="seq.add">添加</button>
      <button id="btnManualCancel" class="btn btn-mini-wide" data-i18n="seq.cancel">取消</button>
    </div>
    <div id="seqList" class="seq-list"></div>
  </section>
  <footer class="site-footer">
    <div class="footer-sign">
      <span class="footer-heart">♥</span>
      <span class="footer-name" data-i18n="footer.signature">M1zukiri</span>
    </div>
    <div class="footer-actions">
      <button class="footer-btn footer-bili" data-href="https://space.bilibili.com/80733922" title="Bilibili 主页">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17.813 4.653h.854c1.51.054 2.769-.578 3.773-1.574a.72.72 0 0 1 1.078.088c.325.414.207 1.035-.156 1.368-1.214 1.187-2.168 1.81-2.913 2.509 2.111.602 3.941 2.296 4.61 4.05.752 1.972.674 4.688-.464 6.992-1.173 2.372-3.153 4.228-5.363 5.278-2.197 1.044-4.756 1.418-7.052.943-2.296-.475-4.344-1.746-5.792-3.493-.895-1.08-1.581-2.32-2.061-3.626-.958-2.605-.477-5.472 1.305-7.487.872-.986 1.942-1.758 3.141-2.295-.946-1.1-2.393-1.855-3.55-2.21-.403-.123-.644-.537-.574-.951.067-.387.374-.692.774-.768 1.959-.371 3.863.31 5.49 1.522.244.18.385.471.385.779v1.342h1.41v-2.66a.79.79 0 0 1 .79-.79h.854zm-.854 2.146h-3.66v2.66c0 .433.356.79.79.79h2.87c.436 0 .789-.354.789-.79v-2.66zM5.69 9.514a.992.992 0 0 0-.989 1.133c.068.683.634 1.17 1.32 1.132.684-.04 1.238-.568 1.24-1.254a.992.992 0 0 0-.995-1.011zm12.276 0a.992.992 0 0 0-.989 1.133c.067.683.633 1.17 1.32 1.132.683-.04 1.237-.568 1.24-1.254a.992.992 0 0 0-.996-1.011zM13.64 13.48c-.79.03-1.53.3-2.183.77a3.87 3.87 0 0 0-1.098 1.245.75.75 0 0 1-1.286-.003 3.87 3.87 0 0 0-1.097-1.244 4.396 4.396 0 0 0-2.184-.77.75.75 0 0 1 .02-1.5 5.52 5.52 0 0 1 3.205 1.048.75.75 0 0 1 .99-.008 5.518 5.518 0 0 1 3.21-1.047.75.75 0 0 1 .031 1.5z"/></svg>
        <span>Bilibili</span>
      </button>
      <button class="footer-btn footer-gh" data-href="https://github.com/M1zukiri" title="GitHub 主页">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
      </button>
      <button id="btnReadme" class="footer-btn" data-i18n-title="footer.readmeTitle" title="打开 README 文档">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>
        <span data-i18n="footer.readme">README</span>
      </button>
      <button id="btnAdvanced" class="footer-btn" data-i18n-title="footer.advancedTitle" title="高级设置（性能/音效/解码）">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9.5 1a.5.5 0 0 1 .5.5v1.05a5 5 0 0 1 1.73.69l.74-.74a.5.5 0 0 1 .7 0l1.4 1.4a.5.5 0 0 1 0 .71l-.74.74c.28.52.5 1.1.69 1.73H15.5a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-1.05a5 5 0 0 1-.69 1.73l.74.74a.5.5 0 0 1 0 .7l-1.4 1.4a.5.5 0 0 1-.7 0l-.74-.74a5 5 0 0 1-1.73.69V15.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-1.05a5 5 0 0 1-1.73-.69l-.74.74a.5.5 0 0 1-.7 0l-1.4-1.4a.5.5 0 0 1 0-.7l.74-.74a5 5 0 0 1-.69-1.73H1.5a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 1 .5-.5h1.05a5 5 0 0 1 .69-1.73l-.74-.74a.5.5 0 0 1 0-.71l1.4-1.4a.5.5 0 0 1 .7 0l.74.74c.52-.28 1.1-.5 1.73-.69V1.5a.5.5 0 0 1 .5-.5Zm-1 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
        <span data-i18n="footer.advanced">高级设置</span>
      </button>
      <button id="btnCheckUpdate" class="footer-btn" data-i18n-title="footer.checkUpdateTitle" title="检查 GitHub 上是否有新版本">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm7-3.25v2.992l2.028.812a.75.75 0 0 1-.557 1.392l-2.5-1A.751.751 0 0 1 7 8.25v-3.5a.75.75 0 0 1 1.5 0Z"/></svg>
        <span data-i18n="footer.checkUpdate">检查更新</span>
      </button>
    </div>
    <div id="updateToast" class="footer-toast" hidden></div>
  </footer>

  <!-- 节拍设置模态框（由 modal.js 注入） -->
  <script src="src/i18n.js"></script>
  <script src="lib/lame.min.js"></script>
  <script src="lib/mp4box.global.js"></script>
  <script src="lib/mp4-muxer.js"></script>
  <script src="src/analysis.js"></script>
  <script src="src/sequence.js"></script>
  <script src="src/unitInput.js"></script>
  <script src="src/store.js"></script>
  <script src="src/settings.js"></script>
  <script src="src/export.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/render.js"></script>
  <script src="src/interact.js"></script>
  <script src="src/modal.js"></script>
  <script src="src/exportModal.js"></script>
  <script src="src/videoExport.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/footer.js"></script>
  <script src="src/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => MC.initFooter());
  </script>
</body>
</html>
