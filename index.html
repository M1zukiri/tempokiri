<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempokiri — 节奏感知的剪辑工具</title>
<style>
  /* ============================================================
     Tempokiri UI 2.0 —— Ableton 式扁平高密度设计
     原则：2px 缝隙面板 · 1px 发丝线分层 · 圆角 ≤4px ·
           颜色只表达功能语义 · 11-12px 字级 · 等宽数字
     变量名保持向后兼容（JS 注入弹窗样式引用同一套变量）
     ============================================================ */
  :root {
    /* 结构令牌 */
    --radius-sm: 3px;
    --radius-md: 4px;
    --radius-lg: 6px;
    --radius-pill: 9999px;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --transition-fast: 0.12s var(--ease-out);
    --transition-normal: 0.2s var(--ease-out);
    /* aurora 色彩令牌 */
    --bg-app: #0c0d10;
    --surface-base: #16181c;
    --surface-raised: #1e2126;
    --surface-overlay: #262a31;
    --surface-active: #30353f;
    --border-subtle: rgba(255,255,255,0.07);
    --border-muted: rgba(255,255,255,0.13);
    --border-focus: rgba(34,211,238,0.55);
    --accent: #22d3ee;
    --accent-muted: rgba(34,211,238,0.14);
    --accent-glow: rgba(34,211,238,0.22);
    --accent-hover: #38bdf8;
    --danger: #ff4d6d;
    --danger-muted: rgba(255,77,109,0.15);
    --warning: #f59e0b;
    --warning-muted: rgba(245,158,11,0.16);
    --success: #34d399;
    --text-primary: #e4e6ea;
    --text-secondary: #9ba1ab;
    --text-tertiary: #60666f;
    /* 阴影令牌（扁平化：仅弹窗/悬浮保留） */
    --shadow-sm: none;
    --shadow-md: 0 4px 14px rgba(0,0,0,0.35);
    --shadow-lg: 0 14px 40px rgba(0,0,0,0.55);
    --shadow-glow: 0 0 10px -2px var(--accent-glow);
    /* 扩展令牌 */
    --accent-2: #a78bfa;
    --accent-fg: #04222b;
    --panel: #16181c;
    --input-bg: #0e1013;
    --wave-bg: #111317;
    --grid-line: rgba(255,255,255,0.02);
    --shadow-inset-wave: inset 0 1px 4px rgba(0,0,0,0.45);
    --scroll-thumb: #2b3038;
    --scroll-thumb-hover: #3a414c;
    --lcd-fg: #7ee7f5;
    --video-pane-w: 260px; /* 视频预览宽度（运行时由拖拽条覆盖到 #videoWrap 上） */
  }
  [data-theme="nebula"] {
    --bg-app: #0c0912;
    --surface-base: #14101b;
    --surface-raised: #1b1524;
    --surface-overlay: #241c30;
    --surface-active: #2e2540;
    --border-subtle: rgba(255,255,255,0.07);
    --border-muted: rgba(255,255,255,0.13);
    --border-focus: rgba(167,139,250,0.55);
    --accent: #a78bfa;
    --accent-muted: rgba(167,139,250,0.15);
    --accent-glow: rgba(167,139,250,0.22);
    --accent-hover: #b7a0fb;
    --text-primary: #e7e1f4;
    --text-secondary: #a295c0;
    --text-tertiary: #655b82;
    --accent-2: #22d3ee;
    --accent-fg: #221238;
    --panel: #14101b;
    --input-bg: #0f0b16;
    --wave-bg: #110d18;
    --grid-line: rgba(255,255,255,0.02);
    --shadow-inset-wave: inset 0 1px 4px rgba(0,0,0,0.45);
    --scroll-thumb: #322847;
    --scroll-thumb-hover: #43365e;
    --lcd-fg: #cbb8fb;
  }
  [data-theme="paper"] {
    --bg-app: #d9d5cb;
    --surface-base: #eae6dd;
    --surface-raised: #f2efe8;
    --surface-overlay: #faf8f3;
    --surface-active: #e3ded2;
    --border-subtle: rgba(0,0,0,0.09);
    --border-muted: rgba(0,0,0,0.17);
    --border-focus: rgba(15,118,110,0.55);
    --accent: #0f766e;
    --accent-muted: rgba(15,118,110,0.12);
    --accent-glow: rgba(15,118,110,0.2);
    --accent-hover: #148f86;
    --text-primary: #2c2825;
    --text-secondary: #66615a;
    --text-tertiary: #948d81;
    --shadow-sm: none;
    --shadow-md: 0 4px 14px rgba(60,52,40,0.18);
    --shadow-lg: 0 14px 40px rgba(60,52,40,0.28);
    --accent-2: #6d4fae;
    --accent-fg: #ffffff;
    --panel: #eae6dd;
    --input-bg: #e0dcd2;
    --wave-bg: #e5e1d8;
    --grid-line: rgba(0,0,0,0.03);
    --shadow-inset-wave: inset 0 1px 4px rgba(60,52,40,0.1);
    --scroll-thumb: #c4bcac;
    --scroll-thumb-hover: #aaa191;
    --danger: #d63a5a;
    --lcd-fg: #0d6d65;
  }
  [data-theme="seigaiha"] {
    /* Seigaiha 青海波 —— 蓝绿深海 · 深色主题
       核心取色: 绿松石蓝 #00A7DF + 孔雀石绿 #009974 */
    --bg-app: #080f14;
    --surface-base: #0e171e;
    --surface-raised: #132029;
    --surface-overlay: #1a2933;
    --surface-active: #22333f;
    --border-subtle: rgba(255,255,255,0.07);
    --border-muted: rgba(255,255,255,0.13);
    --border-focus: rgba(0,167,223,0.55);
    --accent: #00a7df;
    --accent-muted: rgba(0,167,223,0.15);
    --accent-glow: rgba(0,167,223,0.22);
    --accent-hover: #3bbdec;
    --text-primary: #e3eff4;
    --text-secondary: #92adb8;
    --text-tertiary: #587582;
    --accent-2: #009974;
    --accent-fg: #03222f;
    --panel: #0e171e;
    --input-bg: #0a1218;
    --wave-bg: #0b151c;
    --grid-line: rgba(255,255,255,0.02);
    --shadow-inset-wave: inset 0 1px 4px rgba(0,0,0,0.45);
    --scroll-thumb: #1e3542;
    --scroll-thumb-hover: #2a4a5c;
    --lcd-fg: #6fd4f5;
  }
  [data-theme="kurenai"] {
    /* Kurenai 绯暮 —— 红黄暖光 · 深色主题
       核心取色: 金麦色 #F0B200 + 石榴红 #E60012 */
    --bg-app: #100a0c;
    --surface-base: #181114;
    --surface-raised: #20171b;
    --surface-overlay: #291f24;
    --surface-active: #34272d;
    --border-subtle: rgba(255,255,255,0.07);
    --border-muted: rgba(255,255,255,0.13);
    --border-focus: rgba(240,178,0,0.55);
    --accent: #f0b200;
    --accent-muted: rgba(240,178,0,0.14);
    --accent-glow: rgba(240,178,0,0.22);
    --accent-hover: #ffc63a;
    --danger: #ff453a;
    --text-primary: #f3eae5;
    --text-secondary: #baa49c;
    --text-tertiary: #7a625a;
    --accent-2: #b44751;
    --accent-fg: #3a2410;
    --panel: #181114;
    --input-bg: #130d0f;
    --wave-bg: #130d0f;
    --grid-line: rgba(255,255,255,0.02);
    --shadow-inset-wave: inset 0 1px 4px rgba(0,0,0,0.45);
    --scroll-thumb: #3d2b31;
    --scroll-thumb-hover: #503a42;
    --lcd-fg: #ffd24d;
  }
  [data-theme="mono"] {
    /* Monochrome 黑白 —— 纯黑底 · 仅黑白灰单色主题（批注 a6）
       严格无彩：语义色（danger/warning）只用明度区分 */
    --bg-app: #000000;
    --surface-base: #0a0a0a;
    --surface-raised: #111111;
    --surface-overlay: #171717;
    --surface-active: #212121;
    --border-subtle: rgba(255,255,255,0.08);
    --border-muted: rgba(255,255,255,0.16);
    --border-focus: rgba(255,255,255,0.55);
    --accent: #e6e6e6;
    --accent-muted: rgba(255,255,255,0.12);
    --accent-glow: rgba(255,255,255,0.18);
    --accent-hover: #ffffff;
    --danger: #d4d4d4;
    --danger-muted: rgba(255,255,255,0.14);
    --warning: #b3b3b3;
    --warning-muted: rgba(255,255,255,0.10);
    --success: #f2f2f2;
    --text-primary: #ededed;
    --text-secondary: #a3a3a3;
    --text-tertiary: #6b6b6b;
    --shadow-md: 0 4px 14px rgba(0,0,0,0.60);
    --shadow-lg: 0 14px 40px rgba(0,0,0,0.75);
    --accent-2: #8f8f8f;
    --accent-fg: #000000;
    --panel: #0a0a0a;
    --input-bg: #050505;
    --wave-bg: #050505;
    --grid-line: rgba(255,255,255,0.03);
    --shadow-inset-wave: inset 0 1px 4px rgba(0,0,0,0.70);
    --scroll-thumb: #2a2a2a;
    --scroll-thumb-hover: #3d3d3d;
    --lcd-fg: #f2f2f2;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg-app);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 2px;
    overflow-y: auto;
  }
  .mono, .q-val, .seq-progress-time {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  /* ── 顶栏：左品牌+文件操作 · 右导出 ─────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    background: var(--surface-base);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-right: 10px; }
  .brand-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700; font-size: 15px; letter-spacing: 1px;
    color: var(--text-primary);
  }
  .brand-tag {
    color: var(--text-tertiary);
    font-size: 11px;
    white-space: nowrap;
  }
  #brandPulse { height: 20px; width: 64px; opacity: 0.9; }
  .spacer { flex: 1; }

  /* ── 按钮：扁平 28px 高 · 3px 圆角 · 无阴影 ─────────────── */
  .btn {
    background: var(--surface-raised);
    color: var(--text-primary);
    border: 1px solid var(--border-muted);
    border-radius: var(--radius-sm);
    padding: 5px 13px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
    user-select: none;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) {
    background: var(--surface-overlay);
    color: var(--text-primary);
  }
  .btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--bg-app), 0 0 0 3.5px var(--accent);
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    background: var(--surface-base);
    border-color: var(--border-subtle);
  }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-fg);
    font-weight: 650;
    border-color: transparent;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  /* 播放态：当前播放源按钮高亮，另一播放入口弱化 */
  .btn.playing { border-color: var(--accent); color: var(--accent); background: var(--accent-muted); }
  .btn.on { border-color: var(--accent); background: var(--accent); color: var(--panel); }
  .btn.dimmed { opacity: 0.45; }

  /* ── 舞台：波形全宽 · 视频侧栏（右）────────────────────── */
  #stage { display: flex; flex-direction: column; gap: 2px; }
  #waveRow { display: flex; gap: 2px; align-items: stretch; }
  #waveWrap {
    position: relative;
    flex: 1;
    min-width: 0;
    order: 1;
    height: 300px;
    background-color: var(--wave-bg);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-inset-wave);
  }
  #waveWrap.drag-over { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent-glow), inset 0 0 12px var(--accent-muted); }
  #wave { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  /* 空态（未载入文件）时波形区整体可点击打开文件：光标提示 pointer */
  #waveWrap.no-file #wave { cursor: pointer; }
  #playHead { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #waveHint[hidden] { display: none; }
  #waveHint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    pointer-events: none;
    padding: 20px;
    line-height: 1.8;
  }
  #captureBar {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 8px;
    height: 4px;
    background: var(--surface-raised);
    border-radius: 2px;
    overflow: hidden;
  }
  #captureFill { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }
  #selToEnd {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 2;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: var(--radius-sm);
    background: var(--surface-raised);
    border: 1px solid var(--border-muted);
    color: var(--text-primary);
    cursor: pointer;
  }
  #selToEnd:hover { border-color: var(--accent); color: var(--accent); }
  #selToEnd[hidden] { display: none; }
  /* 空态引导卡（未载入文件）：文字穿透点击交由波形区处理，仅按钮可点 */
  .hint-card {
    position: absolute; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 20px;
    pointer-events: none;
  }
  .hint-card[hidden] { display: none; }
  .hint-steps { display: flex; flex-direction: column; gap: 6px; color: var(--text-secondary); font-size: 13px; line-height: 1.7; }
  .hint-card .btn-primary { pointer-events: auto; }
  /* 波形颜色图例（网格存在时显示，右下角） */
  .wave-legend {
    position: absolute; right: 10px; bottom: 18px; z-index: 1;
    display: flex; align-items: center; gap: 10px;
    padding: 3px 9px; border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--surface-base) 85%, transparent);
    border: 1px solid var(--border-subtle);
    font-size: 10.5px; color: var(--text-secondary);
    pointer-events: none;
  }
  .wave-legend[hidden] { display: none; }
  .wave-legend .lg-item { display: inline-flex; align-items: center; gap: 4px; }
  .wave-legend i { width: 11px; height: 2px; border-radius: 1px; display: inline-block; }
  .wave-legend .lg-bar { background: color-mix(in srgb, var(--text-primary) 75%, transparent); }
  .wave-legend .lg-beat { background: color-mix(in srgb, var(--text-primary) 15%, transparent); }
  .wave-legend .lg-sel { background: var(--accent); }
  .wave-legend .lg-play { background: var(--danger); }
  .wave-legend .lg-cutline { background: var(--warning); }

  #videoWrap {
    order: 3;
    width: var(--video-pane-w, 260px);
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000000;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  #videoWrap[hidden] { display: none; }
  #video { width: 100%; height: 100%; max-height: 280px; display: block; object-fit: contain; }
  /* 视频预览与波形之间的拖拽条（批注 a1）：拖动改宽度，双击复位 260px */
  #videoResizer {
    order: 2;
    flex: 0 0 6px;
    width: 6px;
    cursor: col-resize;
    border-radius: var(--radius-sm);
    background: transparent;
    transition: background var(--transition-fast);
    touch-action: none;
  }
  #videoResizer:hover, #videoResizer.dragging { background: var(--accent); }
  #videoResizer[hidden] { display: none; }

  /* ── 走带条（波形下方）：扁平传输带 · LCD 数值 ─────────── */
  .controlbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: var(--surface-base);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    flex-wrap: wrap;
  }
  /* hidden 属性与 display:flex 的优先级：class 规则会覆盖 hidden，需显式关闭 */
  .controlbar[hidden] { display: none; }
  .quickbar[hidden] { display: none; }
  .cb-group {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--input-bg);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 2px;
  }
  .cb-group .btn { border-color: transparent; background: transparent; padding: 4px 11px; }
  .cb-group .btn:hover:not(:disabled) { background: var(--surface-overlay); }
  .cb-group .btn.playing { background: var(--accent-muted); }
  .cb-group .btn.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .quickbar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  /* 快捷微调组：内凹 LCD 风格 */
  .q-group {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--input-bg);
    padding: 2px 6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-subtle);
  }
  .q-label {
    font-size: 9.5px;
    color: var(--text-tertiary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    white-space: nowrap;
    padding: 0 2px;
  }
  .q-val {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--lcd-fg);
    min-width: 56px;
    text-align: center;
    cursor: pointer;
    border-radius: 2px;
    padding: 1px 2px;
  }
  .q-val:hover { background: var(--surface-overlay); }
  .q-btns { display: flex; gap: 2px; }
  .q-btns .btn-mini {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 2px;
    height: 20px;
    padding: 0 5px;
    font-size: 10px;
    color: var(--text-tertiary);
    width: auto;
    min-width: 34px;
  }
  .q-btns .btn-mini:hover { background: var(--surface-overlay); color: var(--text-primary); }
  .q-neg .btn-mini:hover { color: var(--danger); }
  .q-pos .btn-mini:hover { color: var(--accent); }
  /* 快捷栏数值点击直改 */
  .q-edit {
    width: 68px; height: 20px;
    background: var(--bg-app);
    border: 1px solid var(--accent);
    border-radius: 2px;
    color: var(--text-primary);
    font-size: 11.5px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  /* 操作说明 popover（控制栏 ? 按钮） */
  .hint-wrap { position: relative; margin-left: 2px; }
  .hint-btn { width: 22px; height: 22px; font-size: 11px; font-weight: 600; }
  .hint-pop {
    position: absolute; right: 0; bottom: calc(100% + 8px);
    background: var(--surface-overlay);
    border: 1px solid var(--border-muted);
    border-radius: var(--radius-md);
    padding: 7px 11px;
    font-size: 11.5px;
    color: var(--text-secondary);
    box-shadow: var(--shadow-md);
    z-index: 5;
    white-space: nowrap;
  }
  .hint-pop[hidden] { display: none; }

  /* ── 状态行：细分隔单元格 ─────────────────────────────── */
  #statusBar {
    min-height: 22px;
    display: flex;
    align-items: center;
    padding: 2px 10px;
    background: var(--surface-base);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    color: var(--text-tertiary);
    font-size: 11px;
    letter-spacing: 0.2px;
  }
  /* 状态分级着色（main.js status(msg, kind) 控制） */
  #statusBar.status-error { color: var(--danger); }
  #statusBar.status-warn { color: var(--warning); }

  /* ── 序列面板：扁平 dock ──────────────────────────────── */
  .seq-panel {
    background: var(--surface-base);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .seq-header { display: flex; align-items: center; gap: 8px; }
  .seq-header h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
  }
  #seqInfo { color: var(--text-tertiary); font-weight: 400; margin-left: 6px; font-size: 11px; text-transform: none; letter-spacing: 0; }
  .seq-toolbar { margin-bottom: 8px; }
  .seq-list { display: flex; flex-direction: column; gap: 2px; }

  /* 序列卡片 → 高密度行 */
  .seq-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-raised);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    font-size: 12px;
    flex-wrap: wrap;
    cursor: grab;
    user-select: none;
    transition: background var(--transition-fast), border-color var(--transition-fast);
  }
  .seq-card:active { cursor: grabbing; }
  .seq-card:hover {
    background: var(--surface-overlay);
    border-color: var(--border-muted);
  }
  .seq-card.playing {
    background: var(--accent-muted);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .seq-card.playing::before {
    content: '';
    position: absolute;
    left: -1px; top: 4px; bottom: 4px;
    width: 2.5px;
    border-radius: 2px;
    background: var(--accent);
  }
  .seq-card.dragging { opacity: 0.55; border-color: var(--accent); cursor: grabbing; }
  .seq-card.invalid { border-color: #e5484d; box-shadow: 0 0 0 1px #e5484d inset; }
  .seq-num {
    width: 19px; height: 19px;
    border-radius: var(--radius-sm);
    background: var(--surface-active); color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 650; font-size: 10.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  .seq-card.playing .seq-num { background: var(--accent); color: var(--accent-fg); }
  .seq-range { font-weight: 600; }
  .seq-time { color: var(--text-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
  /* 静音段卡片 */
  .seq-silent {
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 600; color: var(--warning);
  }
  .seq-card.silent { border-style: dashed; border-color: color-mix(in srgb, var(--warning) 35%, transparent); }
  .seq-card.silent:hover { border-color: var(--warning); }
  .fade { display: flex; align-items: center; gap: 4px; color: var(--text-secondary); font-size: 11px; }
  .fade input { width: 60px; }
  .btn-mini {
    background: transparent;
    color: var(--text-tertiary);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    width: auto;
    min-width: 24px;
    height: 22px;
    padding: 0 6px;
    cursor: pointer;
    font-size: 11px;
    line-height: 1;
    white-space: nowrap; /* 双字/长文本按钮横向自适应，避免竖排截断 */
  }
  .btn-mini:hover { background: var(--surface-overlay); color: var(--text-primary); border-color: var(--border-muted); }
  .btn-mini.del:hover { border-color: var(--danger); color: var(--danger); }
  /* 序列卡片：折叠行（淡入/淡出）与展开切换 */
  .seq-detail { display: flex; gap: 12px; flex-basis: 100%; padding-left: 29px; flex-wrap: wrap; }
  .seq-detail[hidden] { display: none; }
  .seq-toggle { transition: transform var(--transition-fast); }
  .seq-toggle.open { transform: rotate(180deg); }

  /* 单位/区间输入组件 */
  .unit-input { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; }
  .unit-mode-btn { font-size: 10.5px; padding: 1px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border-muted); background: var(--surface-overlay); color: var(--text-tertiary); cursor: pointer; white-space: nowrap; }
  .unit-mode-btn:hover { color: var(--text-primary); border-color: var(--accent); }
  .unit-fields { display: inline-flex; gap: 3px; }
  .unit-fields.unit-invalid input { border-color: #e5484d; background: rgba(229,72,77,0.14); }
  .unit-fields input { width: 56px; padding: 2px 4px; }
  .unit-ref:has(+ .unit-invalid), .unit-invalid + .unit-ref { color: #e5484d; }
  .range-input { display: inline-flex; flex-direction: column; gap: 3px; font-size: 11.5px; }
  .range-input .ri-block { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .range-input .ri-block .ri-fields { display: none; }
  .range-input .ri-block.ri-active .ri-fields { display: inline-flex; gap: 4px; }
  .range-input .ri-block.ri-active .ri-fgroup { display: inline-flex; align-items: center; gap: 3px; }
  .range-input .ri-block.ri-active .ri-ref { display: none; }
  .range-input .ri-block:not(.ri-active) .ri-ref { display: inline-flex; font-size: 11.5px; color: var(--text-tertiary); }
  .range-input .ri-block:not(.ri-active) { opacity: 0.7; }
  .range-input .ri-fld { font-size: 10.5px; color: var(--text-tertiary); white-space: nowrap; }
  .range-input .ri-ref { color: var(--text-tertiary); font-size: 11.5px; }
  .range-input .ri-row { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-secondary); white-space: nowrap; cursor: pointer; }
  .range-input .ri-row input[type="radio"] { accent-color: var(--accent); margin: 0; }
  .range-input input[type="number"] { width: 52px; padding: 2px 4px; font-size: 11.5px; border: 1px solid var(--border-muted); border-radius: var(--radius-sm); background: var(--input-bg); color: var(--text-primary); }
  .range-input input[type="number"]:focus { outline: none; border-color: var(--accent); }
  .seq-edges { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .edge-label { font-size: 10.5px; color: var(--text-tertiary); }
  .manual-form { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px dashed var(--border-muted); border-radius: var(--radius-md); background: var(--surface-raised); flex-wrap: wrap; }
  .manual-form[hidden] { display: none; }
  .modal-actions { display: flex; align-items: center; gap: 8px; }

  /* 输入框统一样式 */
  .unit-fields input, .fade input, .modal-form input[type="number"], .modal-form select, .seg-table input[type="number"], .seg-table select,
  .manual-form input[type="number"], .manual-form input[type="text"], .manual-form select {
    background: var(--input-bg);
    border: 1px solid var(--border-muted);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 4px 7px;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    transition: border-color var(--transition-fast);
  }
  .unit-fields input { width: 56px; padding: 2px 4px; }
  .unit-fields input:focus, .fade input:focus, .modal-form input:focus, .modal-form select:focus, .seg-table input:focus, .seg-table select:focus,
  .manual-form input:focus, .manual-form select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-muted);
  }
  /* 按钮按压反馈 */
  .btn-mini:active, .unit-mode-btn:active { transform: translateY(1px); }

  /* 空状态提示 */
  .empty {
    display: flex; align-items: center; gap: 8px;
    color: var(--text-secondary); font-size: 12px; padding: 9px 12px;
    background: var(--surface-raised); border: 1px dashed var(--border-muted); border-radius: var(--radius-md);
  }
  .empty::before { content: 'ℹ'; color: var(--accent); font-size: 13px; }

  /* 拼接序列进度条：细轨道 · 金黄 seam · 玫红播放头 */
  .seq-progress {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 10px;
    background: var(--input-bg);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
  }
  .seq-progress[hidden] { display: none; }
  .seq-progress-track {
    position: relative;
    flex: 1;
    height: 8px;
    background: var(--bg-app);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    cursor: pointer;
    overflow: visible;
    touch-action: none;
  }
  .seq-progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius: var(--radius-sm);
    pointer-events: none;
  }
  /* 拼接点标记：段边界竖线（金黄，与播放头玫红、填充青色区分） */
  .seq-progress-seams {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .seq-progress-seams .seam {
    position: absolute;
    top: -2px; bottom: -2px;
    width: 2px;
    margin-left: -1px;
    background: var(--warning);
    border-radius: 1px;
  }
  .seq-progress-knob {
    position: absolute;
    top: 50%;
    width: 4px; height: 18px;
    margin-left: -2px;
    margin-top: -9px;
    border-radius: 1px;
    background: var(--danger);
    pointer-events: none;
  }
  /* 拖动定位时的悬浮时间气泡 */
  .seq-progress-tip {
    position: absolute;
    bottom: 14px;
    transform: translateX(-50%);
    background: var(--surface-overlay);
    border: 1px solid var(--border-muted);
    border-radius: var(--radius-sm);
    padding: 2px 8px;
    font-size: 10.5px;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    white-space: nowrap;
    z-index: 3;
  }
  .seq-progress-tip[hidden] { display: none; }
  .seq-progress-time {
    font-size: 11px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 110px;
    text-align: right;
  }

  /* ── 模态框 ───────────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--surface-base);
    border: 1px solid var(--border-muted);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    width: 380px;
    max-width: calc(100vw - 40px);
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }
  .modal h3 { margin: 0 0 6px; font-size: 14px; }
  .modal-sub { margin: 0 0 14px; color: var(--text-secondary); font-size: 11.5px; }
  .modal-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .modal-form label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-primary); }
  .modal-form input[type="number"], .modal-form select { min-width: 0; }
  .modal-form input[type="number"] { flex: 1; }
  .modal-wide { width: 720px; max-width: calc(100vw - 40px); }
  .th-sub { font-weight: 400; color: var(--text-secondary); font-size: 10px; }
  .seg-rest { color: var(--text-secondary); font-size: 11.5px; white-space: nowrap; }
  .seg-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .seg-table th { font-size: 10.5px; color: var(--text-secondary); font-weight: 500; padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--border-muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .seg-table td { padding: 4px 6px; vertical-align: middle; }
  .seg-table .seg-bpm { width: 70px; }
  .seg-table .seg-qty { width: 64px; }
  .seg-table .seg-res { width: 60px; }
  .seg-note { margin: -2px 0 10px; font-size: 10.5px; color: var(--text-tertiary); line-height: 1.6; }
  .modal-status { color: var(--accent); font-size: 11.5px; margin-bottom: 10px; }

  /* ── 页脚：扁平状态条 ─────────────────────────────────── */
  .site-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 6px 10px;
    background: var(--surface-base);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    position: relative; /* 保留：footer-toast 的 absolute 定位上下文 */
    margin-top: auto;
    flex-shrink: 0;
  }
  .footer-sign {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .footer-logo {
    display: inline-flex;
    align-items: center;
    color: var(--accent);
  }
  .footer-name {
    font-weight: 650;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: var(--text-primary);
  }
  .footer-version {
    font-size: 10px;
    color: var(--accent);
    background: var(--accent-muted);
    border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
    border-radius: var(--radius-sm);
    padding: 1px 6px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .footer-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .footer-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: transparent;
    color: var(--text-tertiary);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 4px 9px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all var(--transition-fast);
  }
  .footer-btn:hover {
    color: var(--text-primary);
    background: var(--surface-overlay);
  }
  .footer-btn:disabled { opacity: 0.5; cursor: wait; }
  .footer-btn svg { width: 14px; height: 14px; }
  .footer-bili:hover { color: #fb7299; }
  #btnReadme:hover, #btnCheckUpdate:hover, #btnAdvanced:hover, #btnMeta:hover, #btnTheme:hover { color: var(--accent); }
  .footer-toast {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 12px;
    background: var(--surface-overlay);
    border: 1px solid var(--accent);
    border-radius: var(--radius-md);
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text-primary);
    box-shadow: var(--shadow-md);
    z-index: 90;
  }
  .footer-toast[hidden] { display: none; }
  /* 数字排版等宽 */
  .seq-num, .seq-time, .seq-range, .seq-progress-time, .q-val, .footer-version {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }

  /* README 弹窗 */
  .readme-modal { width: 720px; max-width: calc(100vw - 40px); display: flex; flex-direction: column; max-height: 80vh; }
  .readme-modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .readme-modal-head h3 { margin: 0; font-size: 15px; }
  .readme-version { font-size: 11px; color: var(--text-secondary); }
  .readme-modal-body {
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.7;
    padding-right: 6px;
  }
  .readme-modal-body h2 { font-size: 16px; margin: 14px 0 6px; color: var(--accent); }
  .readme-modal-body h3 { font-size: 14px; margin: 12px 0 6px; }
  .readme-modal-body p { margin: 6px 0; }
  .readme-modal-body ul, .readme-modal-body ol { margin: 6px 0; padding-left: 22px; }
  .readme-modal-body li { margin: 3px 0; }
  .readme-modal-body code {
    background: var(--surface-overlay);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 12px;
    font-family: ui-monospace, Consolas, monospace;
  }
  .readme-modal-body pre {
    background: var(--input-bg);
    border: 1px solid var(--border-muted);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    overflow-x: auto;
  }
  .readme-modal-body pre code { background: none; padding: 0; }

  /* 细滚动条 */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 5px; border: 2px solid var(--bg-app); }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
  body { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) var(--bg-app); }

  /* 键盘焦点轮廓（可访问性，鼠标点击不显示） */
  .btn-mini:focus-visible, .unit-mode-btn:focus-visible, .footer-btn:focus-visible, .exp-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* 窄屏（≤480px）：按钮文字不换行压缩，整组换行；保持无水平滚动 */
  @media (max-width: 480px) {
    .brand-tag { display: none; }
    .controlbar { gap: 6px; padding: 5px 6px; }
    .cb-group { flex-wrap: wrap; }
    .cb-group .btn { padding: 4px 8px; font-size: 11.5px; }
    .quickbar { gap: 6px; flex-wrap: wrap; width: 100%; }
    .q-group { gap: 3px; flex-wrap: wrap; }
    .q-btns .btn-mini { min-width: 28px; padding: 0 4px; font-size: 9.5px; }
    /* 窄屏：视频预览与波形上下堆叠，避免波形被压扁 */
    #waveRow { flex-direction: column; }
    #videoResizer { display: none; }
    #videoWrap { width: 100%; order: 2; }
    #video { max-height: 200px; }
    #waveWrap { height: 220px; order: 1; }
    .seq-panel { padding: 8px 10px; }
  }
  /* 超窄屏（≤400px）：进一步压缩微调按钮与引导文字 */
  @media (max-width: 400px) {
    .q-btns .btn-mini { min-width: 24px; font-size: 9px; }
    .hint-steps { font-size: 12px; }
    .wave-legend { gap: 8px; font-size: 10px; right: 8px; bottom: 16px; }
  }
</style>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><span class="brand-name" data-i18n="app.brandName">Tempokiri</span><span class="footer-version">v<span data-version>__VERSION__</span></span><canvas id="brandPulse" width="64" height="20" aria-hidden="true"></canvas><span class="brand-tag" data-i18n="app.brandTag">节奏感知的音频/视频剪辑工作站</span></div>
    <input id="fileInput" type="file" accept="audio/*,video/*" hidden />
    <button id="btnOpenFile" class="btn" data-i18n="toolbar.openFile">打开文件</button>
    <button id="btnSettings" class="btn" disabled data-i18n="toolbar.setBpm" data-i18n-title="toolbar.setBpmTitle">设置节拍</button>
    <button id="btnAutoCut" class="btn" disabled data-i18n="toolbar.autoCut">✂ 自动剪辑</button>
    <span class="spacer"></span>
    <button id="btnExport" class="btn btn-primary" disabled data-i18n="toolbar.export">导出</button>
  </header>

  <div id="stage">
    <div id="waveRow">
      <div id="videoWrap" hidden><video id="video"></video></div>
      <div id="videoResizer" hidden aria-hidden="true" title="拖动调整视频预览宽度 · 双击复位"></div>
      <div id="waveWrap" class="no-file">
        <canvas id="wave"></canvas>
        <canvas id="playHead"></canvas>
        <div id="hintCard" class="hint-card">
          <div class="hint-steps">
            <div class="hint-step" data-i18n="hint.guide1">① 打开音频或视频文件</div>
            <div class="hint-step" data-i18n="hint.guide2">② 自动识别节拍，点击「确认」应用网格</div>
            <div class="hint-step" data-i18n="hint.guide3">③ 双击选小节 · 拖拽选区 · 或一键自动剪辑</div>
          </div>
          <button id="btnHintOpen" class="btn btn-primary" data-i18n="toolbar.openFile">打开文件</button>
        </div>
        <div id="waveHint" hidden data-i18n="wave.hint">拖入音频或视频文件，或点击此处选择文件开始剪辑</div>
        <div id="captureBar" hidden><div id="captureFill"></div></div>
        <button id="selToEnd" class="sel-chip" hidden data-i18n="wave.toEnd">⤳ 延伸到末尾</button>
        <div id="waveLegend" class="wave-legend" hidden>
          <span class="lg-item"><i class="lg-bar"></i><span data-i18n="wave.legendBar">小节线</span></span>
          <span class="lg-item"><i class="lg-beat"></i><span data-i18n="wave.legendBeat">拍线</span></span>
          <span class="lg-item"><i class="lg-sel"></i><span data-i18n="wave.legendSel">选区</span></span>
          <span class="lg-item"><i class="lg-play"></i><span data-i18n="wave.legendPlay">播放头</span></span>
          <span class="lg-item lg-cut" hidden><i class="lg-cutline"></i><span data-i18n="wave.legendCut">剪切点</span></span>
        </div>
      </div>
    </div>
    <!-- 走带条：置于波形下方（传输控制 + BPM/偏移快捷微调） -->
    <div id="controlBar" class="controlbar" hidden>
      <span class="cb-group">
        <button id="btnPlay" class="btn" disabled data-i18n="wave.play">▶ 播放</button>
        <button id="btnStop" class="btn" disabled data-i18n="wave.stop">⏹ 停止</button>
        <button id="btnPlaySeq" class="btn" disabled data-i18n="wave.playSeq">▶ 播放拼接序列</button>
        <button id="btnAddSelection" class="btn" disabled data-i18n="wave.addSelection">＋ 添加选中区间</button>
        <button id="btnMtr" class="btn" disabled data-i18n="metronome.toggle">🎵 节拍器</button>
        <button id="btnMtrSet" class="btn-mini" disabled data-i18n-title="metronome.setTitle" title="节拍器设置">⚙</button>
      </span>
      <span class="spacer"></span>
      <div id="quickBar" class="quickbar" hidden>
        <span class="q-group">
          <span class="q-label" id="qBpmLabel" data-i18n="quick.bpm">BPM</span>
          <span class="q-btns q-neg">
            <button class="btn btn-mini" data-q="bpm" data-d="-1">-1</button>
            <button class="btn btn-mini" data-q="bpm" data-d="-0.1">-0.1</button>
            <button class="btn btn-mini" data-q="bpm" data-d="-0.01">-0.01</button>
          </span>
          <span class="q-val" id="qBpmVal">--</span>
          <span class="q-btns q-pos">
            <button class="btn btn-mini" data-q="bpm" data-d="0.01">+0.01</button>
            <button class="btn btn-mini" data-q="bpm" data-d="0.1">+0.1</button>
            <button class="btn btn-mini" data-q="bpm" data-d="1">+1</button>
          </span>
        </span>
        <span class="q-group">
          <span class="q-label" data-i18n="quick.offset">偏移</span>
          <span class="q-btns q-neg">
            <button class="btn btn-mini" data-q="offset" data-d="-1">-1</button>
            <button class="btn btn-mini" data-q="offset" data-d="-0.1">-0.1</button>
            <button class="btn btn-mini" data-q="offset" data-d="-0.01">-0.01</button>
          </span>
          <span class="q-val" id="qOffsetVal">--</span>
          <span class="q-btns q-pos">
            <button class="btn btn-mini" data-q="offset" data-d="0.01">+0.01</button>
            <button class="btn btn-mini" data-q="offset" data-d="0.1">+0.1</button>
            <button class="btn btn-mini" data-q="offset" data-d="1">+1</button>
          </span>
        </span>
      </div>

        <button id="hintBtn" class="btn-mini hint-btn" type="button" aria-expanded="false" aria-label="操作说明">?</button>
        <div id="hintPop" class="hint-pop" hidden>
          <span data-i18n="wave.hintInline">单击定位 · 双击选小节 · 拖拽选区 · 滚轮平移 · Ctrl+滚轮缩放 · Shift+拖拽平移</span>
        </div>
      </div>
    </div>
  </div>

  <section id="sequencePanel" class="seq-panel">
    <div class="seq-header">
      <h2><span data-i18n="seq.title">拼接序列</span><span id="seqInfo"></span></h2>
      <span class="spacer"></span>
      <button id="btnSilentAdd" class="btn" data-i18n="seq.addSilent">＋ 添加静音段</button>
      <button id="btnManualAdd" class="btn" data-i18n="seq.manualAdd">手动添加</button>
    </div>
    <!-- 拼接序列进度条：播放进度控制；每个拼接点（段边界）以特殊标记注明 -->
    <div id="seqProgress" class="seq-progress" hidden>
      <div class="seq-progress-track" id="seqProgressTrack">
        <div class="seq-progress-fill" id="seqProgressFill"></div>
        <div class="seq-progress-seams" id="seqProgressSeams"></div>
        <div class="seq-progress-knob" id="seqProgressKnob"></div>
        <div id="seqProgressTip" class="seq-progress-tip" hidden></div>
      </div>
      <span class="seq-progress-time" id="seqProgressTime">0:00.0 / 0:00.0</span>
    </div>
    <div id="manualForm" class="manual-form" hidden>
      <span class="edge-label" data-i18n="seq.edgeStart">起</span><span id="maRange"></span>
      <button id="btnManualOk" class="btn btn-mini-wide" data-i18n="seq.add">添加</button>
      <button id="btnManualCancel" class="btn btn-mini-wide" data-i18n="seq.cancel">取消</button>
    </div>
    <div id="silentForm" class="manual-form" hidden>
      <span class="edge-label" data-i18n="seq.silentDur">时长</span>
      <label class="ri-row"><input type="radio" name="silentMode" id="silentMus" checked /> <span data-i18n="seq.silentMusPair">小节/拍</span></label>
      <input id="silentQty" type="number" min="0.01" step="0.01" value="1" aria-label="静音时长" />
      <select id="silentUnit">
        <option value="bar" data-i18n="seq.unitBar">小节</option>
        <option value="beat" data-i18n="seq.unitBeat">拍</option>
      </select>
      <label class="ri-row"><input type="radio" name="silentMode" id="silentSec" /> <span data-i18n="seq.unitTime">精确时长</span></label>
      <input id="silentQtySec" type="number" min="0.001" step="0.01" value="1" aria-label="精确时长（秒）" disabled />
      <input id="silentBpm" type="number" min="1" max="400" step="0.01" aria-label="静音段 BPM（空=跟随前段）" />
      <input id="silentMeter" type="text" aria-label="静音段拍号（如 4/4，空=跟随前段）" />
      <button id="btnSilentOk" class="btn btn-mini-wide" data-i18n="seq.add">添加</button>
      <button id="btnSilentCancel" class="btn btn-mini-wide" data-i18n="seq.cancel">取消</button>
    </div>
    <div id="seqList" class="seq-list"></div>
  </section>
