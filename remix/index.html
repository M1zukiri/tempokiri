<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempokiri — 节奏感知的剪辑工具</title>
<style>
  :root {
    --bg: #0e1014;
    --panel: #151922;
    --panel-2: #1a1f2b;
    --border: #262d3d;
    --text: #d7dde8;
    --text-dim: #7d8794;
    --accent: #22d3ee;
    --danger: #f43f5e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: 0.4px; margin-right: 8px; }
  .brand em { color: var(--accent); font-style: normal; }
  .spacer { flex: 1; }
  .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #04222b; font-weight: 600; border-color: var(--accent); }
  .btn-primary:hover:not(:disabled) { background: #4adcf2; }

  #stage { position: relative; margin: 10px 14px; }
  #waveWrap {
    position: relative;
    height: 260px;
    background: #12151b;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  #waveWrap.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(34,211,238,0.25); }
  #wave { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #playHead { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #waveHint[hidden] { display: none; }
  #waveHint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    pointer-events: none;
    padding: 20px;
    line-height: 1.8;
  }
  #captureBar {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 10px;
    height: 6px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
  }
  #captureFill { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }

  #waveRow { display: flex; gap: 10px; align-items: stretch; }
  #videoWrap {
    width: 260px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  #videoWrap[hidden] { display: none; }
  #waveWrap { flex: 1; min-width: 0; }
  #video { width: 100%; height: 100%; max-height: 260px; display: block; object-fit: contain; }

  #statusBar {
    margin: 0 14px;
    min-height: 20px;
    font-size: 12px;
  }

  .hint-inline { color: var(--text-dim); font-size: 12px; }
  #seqInfo { color: var(--text-dim); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .empty { color: var(--text-dim); font-size: 13px; padding: 8px 0; }
  .seq-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    flex-wrap: wrap;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
  }
  .seq-card:hover {
    border-color: rgba(34,211,238,0.45);
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    transform: translateY(-1px);
  }
  .seq-card.playing {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset, 0 4px 18px rgba(34,211,238,0.18);
  }
  .seq-card.playing::before {
    content: '';
    position: absolute;
    left: -1px; top: 8px; bottom: 8px;
    width: 3px;
    border-radius: 2px;
    background: var(--danger);
  }
  .seq-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent); color: #04222b;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
  }
  .seq-range { font-weight: 600; }
  .seq-time { color: var(--text-dim); font-size: 12px; }
  .fade { display: flex; align-items: center; gap: 4px; color: var(--text-dim); font-size: 12px; }
  .fade input {
    width: 64px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 12px;
  }
  .btn-mini {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 5px;
    width: 26px; height: 26px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .btn-mini:hover { border-color: var(--accent); color: var(--text); }
  .btn-mini.del:hover { border-color: var(--danger); color: var(--danger); }

  /* 模态框 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 22px;
    width: 380px;
    max-width: calc(100vw - 40px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h3 { margin: 0 0 6px; font-size: 16px; }
  .modal-sub { margin: 0 0 14px; color: var(--text-dim); font-size: 12px; }
  .modal-form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .modal-form label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .modal-form input[type="number"], .modal-form select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    min-width: 0;
  }
  .modal-form input[type="number"] { flex: 1; }
  .modal-wide { width: 720px; max-width: calc(100vw - 40px); }
  .th-sub { font-weight: 400; color: var(--text-dim); font-size: 10px; }
  .seg-rest { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
  .seg-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .seg-table th { font-size: 11px; color: var(--text-dim); font-weight: 500; padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--border); }
  .seg-table td { padding: 4px 6px; vertical-align: middle; }
  .seg-table input[type="number"], .seg-table select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 4px 6px; font-size: 12px; }
  .seg-table .seg-bpm { width: 70px; }
  .seg-table .seg-qty { width: 64px; }
  .seg-table .seg-res { width: 60px; }
  .modal-status { color: var(--accent); font-size: 12px; margin-bottom: 10px; }
  .q-group { display: flex; align-items: center; gap: 5px; }
  .q-label { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .q-val { font-size: 13px; font-weight: 600; color: var(--accent); min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
  .q-btns { display: flex; gap: 3px; }
  .q-neg .btn-mini { border-color: rgba(244,63,94,0.35); }
  .q-neg .btn-mini:hover { border-color: var(--danger); color: var(--danger); }
  .q-pos .btn-mini { border-color: rgba(34,211,238,0.35); }
  .q-pos .btn-mini:hover { border-color: var(--accent); color: var(--accent); }
  .q-btns .btn-mini { width: auto; height: 22px; padding: 0 6px; font-size: 11px; min-width: 36px; }
  .controlbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    flex-wrap: wrap;
  }
  .cb-group { display: flex; align-items: center; gap: 6px; }
  .cb-group .btn { padding: 6px 12px; }
  .controlbar .hint-inline { margin-left: 2px; }
  .quickbar { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  .seq-toolbar { margin-bottom: 8px; }
  .seq-panel {
    margin: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .seq-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .seq-header h2 { margin: 0; font-size: 14px; }
  .seq-list { display: flex; flex-direction: column; gap: 8px; }
  .seq-card.dragging { opacity: 0.55; border-color: var(--accent); box-shadow: 0 6px 18px rgba(0,0,0,0.4); cursor: grabbing; }
  .seq-card { cursor: grab; user-select: none; }
  .seq-card:active { cursor: grabbing; }
  .unit-input { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
  .unit-mode-btn { font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: var(--muted); cursor: pointer; white-space: nowrap; }
  .unit-mode-btn:hover { color: var(--text); border-color: var(--accent); }
  .unit-fields { display: inline-flex; gap: 3px; }
  .unit-fields.unit-invalid input { border-color: #e5484d; background: rgba(229,72,77,0.14); }
  .unit-fields input { width: 58px; padding: 2px 4px; border: 1px solid var(--border); border-radius: 5px; background: rgba(0,0,0,0.35); color: var(--text); font-size: 12px; }
  .unit-ref:has(+ .unit-invalid), .unit-invalid + .unit-ref { color: #e5484d; }
  .seq-edges { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .edge-label { font-size: 11px; color: var(--muted); }
  .seq-card.invalid { border-color: #e5484d; box-shadow: 0 0 0 1px #e5484d inset; }
  .manual-form { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 10px; border: 1px dashed var(--border); border-radius: 10px; background: rgba(255,255,255,0.03); flex-wrap: wrap; }
  .manual-form[hidden] { display: none; }
  .modal-actions { display: flex; align-items: center; gap: 8px; }
  /* 输入聚焦发光 */
  .unit-fields input:focus, .fade input:focus, .modal-form input:focus, .modal-form select:focus, .seg-table input:focus, .seg-table select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(34,211,238,0.18);
  }
  /* 按钮按压反馈 */
  .btn:active:not(:disabled), .btn-mini:active, .unit-mode-btn:active { transform: translateY(1px); }
  .btn-primary { box-shadow: 0 2px 10px rgba(34,211,238,0.22); }
  /* 细滚动条 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #2a3345; border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #3a4560; }
  body { scrollbar-width: thin; scrollbar-color: #2a3345 var(--bg); }
  /* 空状态引导（波形区 hint 已有；序列空态增强） */
  .empty { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13px; padding: 10px 14px; background: rgba(255,255,255,0.02); border: 1px dashed var(--border); border-radius: 8px; }
  .empty::before { content: 'ℹ'; color: var(--accent); font-size: 14px; }
  /* 拼接序列进度条 */
  .seq-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    margin-bottom: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .seq-progress[hidden] { display: none; }
  .seq-progress-track {
    position: relative;
    flex: 1;
    height: 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    overflow: hidden;
    touch-action: none;
  }
  .seq-progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: linear-gradient(90deg, rgba(34,211,238,0.35), var(--accent));
    border-radius: 6px 0 0 6px;
    pointer-events: none;
  }
  /* 拼接点标记：段边界竖线（金黄，与播放头玫红、填充青色区分） */
  .seq-progress-seams {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .seq-progress-seams .seam {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: rgba(250,204,21,0.85);
    box-shadow: 0 0 4px rgba(250,204,21,0.5);
  }
  .seq-progress-knob {
    position: absolute;
    top: 50%;
    width: 14px; height: 14px;
    margin-left: -7px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--danger);
    border: 2px solid #fff;
    box-shadow: 0 0 6px rgba(244,63,94,0.6);
    pointer-events: none;
  }
  .seq-progress-time {
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 110px;
    text-align: right;
  }
  /* 页脚签名 */
  .site-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin: 14px;
    margin-top: 6px;
    padding: 12px 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.05));
    border: 1px solid var(--border);
    border-radius: 12px;
    position: relative;
  }
  .footer-sign {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }
  .footer-heart {
    color: var(--danger);
    font-size: 16px;
    text-shadow: 0 0 8px rgba(244,63,94,0.8);
    animation: footer-heartbeat 1.6s ease-in-out infinite;
  }
  @keyframes footer-heartbeat {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.25); }
    24% { transform: scale(1); }
    36% { transform: scale(1.18); }
    48% { transform: scale(1); }
  }
  .footer-name {
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1.5px;
    background: linear-gradient(90deg, var(--accent), #a78bfa, var(--danger));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 18px rgba(34,211,238,0.25);
  }
  .footer-tag {
    color: var(--text-dim);
    font-size: 12px;
  }
  .footer-version {
    font-size: 11px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 8px;
    font-variant-numeric: tabular-nums;
  }
  .footer-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .footer-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
  }
  .footer-btn:hover {
    transform: translateY(-1px);
  }
  .footer-btn:disabled { opacity: 0.5; cursor: wait; }
  .footer-bili:hover {
    border-color: #fb7299;
    color: #fb7299;
    box-shadow: 0 0 12px rgba(251,114,153,0.35);
  }
  .footer-gh:hover {
    border-color: #e6edf3;
    color: #e6edf3;
    box-shadow: 0 0 12px rgba(230,237,243,0.3);
  }
  #btnReadme:hover, #btnCheckUpdate:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(34,211,238,0.3);
  }
  .footer-toast {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 16px;
    background: var(--panel-2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 90;
  }
  .footer-toast[hidden] { display: none; }
  /* README 弹窗 */
  .readme-modal { width: 720px; max-width: calc(100vw - 40px); display: flex; flex-direction: column; max-height: 80vh; }
  .readme-modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .readme-modal-head h3 { margin: 0; font-size: 16px; }
  .readme-version { font-size: 11px; color: var(--text-dim); }
  .readme-modal-body {
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.7;
    padding-right: 6px;
  }
  .readme-modal-body h2 { font-size: 17px; margin: 14px 0 6px; color: var(--accent); }
  .readme-modal-body h3 { font-size: 15px; margin: 12px 0 6px; }
  .readme-modal-body h4 { font-size: 13px; margin: 10px 0 4px; }
  .readme-modal-body p { margin: 6px 0; }
  .readme-modal-body ul, .readme-modal-body ol { margin: 6px 0; padding-left: 22px; }
  .readme-modal-body li { margin: 3px 0; }
  .readme-modal-body code {
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12px;
    font-family: ui-monospace, Consolas, monospace;
  }
  .readme-modal-body pre {
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
  }
  .readme-modal-body pre code { background: none; padding: 0; }
</style>
</head>
<body>
  <header class="toolbar">
    <div class="brand">Tempokiri <em>工作站</em></div>
    <input id="fileInput" type="file" accept="audio/*,video/*" hidden />
    <button id="btnOpenFile" class="btn">打开文件</button>
    <button id="btnSettings" class="btn" disabled>设置节拍</button>
    <span class="spacer"></span>
    <button id="btnExport" class="btn btn-primary" disabled>导出</button>
  </header>

  <div id="stage">
    <div id="waveRow">
      <div id="videoWrap" hidden><video id="video" controls></video></div>
      <div id="waveWrap">
        <canvas id="wave"></canvas>
        <canvas id="playHead"></canvas>
        <div id="waveHint">拖入音频或视频文件，或点击此处选择文件开始剪辑</div>
        <div id="captureBar" hidden><div id="captureFill"></div></div>
      </div>
    </div>
    <div id="controlBar" class="controlbar" hidden>
      <span class="cb-group">
        <button id="btnPlay" class="btn" disabled>▶ 播放</button>
        <button id="btnStop" class="btn" disabled>⏹ 停止</button>
        <button id="btnPlaySeq" class="btn" disabled>▶ 播放拼接序列</button>
        <button id="btnAddSelection" class="btn" disabled>＋ 添加选中区间</button>
      </span>
      <span class="spacer"></span>
      <div id="quickBar" class="quickbar" hidden>
        <span class="q-group">
          <span class="q-label" id="qBpmLabel">BPM</span>
          <span class="q-btns q-neg">
            <button class="btn btn-mini" data-q="bpm" data-d="-1">-1</button>
            <button class="btn btn-mini" data-q="bpm" data-d="-0.1">-0.1</button>
            <button class="btn btn-mini" data-q="bpm" data-d="-0.01">-0.01</button>
          </span>
          <span class="q-val" id="qBpmVal">--</span>
          <span class="q-btns q-pos">
            <button class="btn btn-mini" data-q="bpm" data-d="0.01">+0.01</button>
            <button class="btn btn-mini" data-q="bpm" data-d="0.1">+0.1</button>
            <button class="btn btn-mini" data-q="bpm" data-d="1">+1</button>
          </span>
        </span>
        <span class="q-group">
          <span class="q-label">偏移</span>
          <span class="q-btns q-neg">
            <button class="btn btn-mini" data-q="offset" data-d="-1">-1</button>
            <button class="btn btn-mini" data-q="offset" data-d="-0.1">-0.1</button>
            <button class="btn btn-mini" data-q="offset" data-d="-0.01">-0.01</button>
          </span>
          <span class="q-val" id="qOffsetVal">--</span>
          <span class="q-btns q-pos">
            <button class="btn btn-mini" data-q="offset" data-d="0.01">+0.01</button>
